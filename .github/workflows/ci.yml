name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ovim/gui/package-lock.json
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - name: Check SolidJS frontend
        run: |
          npm ci --prefix ovim/gui
          npm run check --prefix ovim/gui
          npm test --prefix ovim/gui
          npm run build --prefix ovim/gui
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # The suite includes process- and global-state tests that can race when
        # the Rust harness runs them in parallel, occasionally hanging CI.
        run: cargo test --workspace -- --test-threads=1
