# ============================================================================
# Companion LSP Servers
# ============================================================================
# Companion servers provide additional LSP support alongside primary servers.
# They activate only when activation_markers are present in the project tree.

[[companion_lsp]]
id = "tailwindcss"
name = "Tailwind CSS"
command = "tailwindcss-language-server"
args = ["--stdio"]
applies_to = ["typescript", "tsx", "typescriptreact", "javascript", "javascriptreact", "html", "astro", "css"]
root_markers = ["tailwind.config.js", "tailwind.config.ts", "tailwind.config.cjs", "tailwind.config.mjs", "package.json"]
# Tailwind v3: explicit config files. Tailwind v4: CSS-based config (no config file needed,
# but the package is still in node_modules). node_modules/tailwindcss catches both versions.
activation_markers = ["tailwind.config.js", "tailwind.config.ts", "tailwind.config.cjs", "tailwind.config.mjs", "node_modules/tailwindcss"]
install_hint = "Install with: npm install -g @tailwindcss/language-server"

[companion_lsp.auto_install]
method = { type = "npm", packages = ["@tailwindcss/language-server"], bin = "tailwindcss-language-server" }
policy = "auto_on_missing"
